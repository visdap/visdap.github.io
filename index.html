<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visdap — Visual Day Planner</title>
  <meta name="description" content="Visdap: your whole day on one 24-hour dial. Choose your language.">
  <meta name="color-scheme" content="light dark">
  <!-- Корінь лише переносить на мовну сторінку: не індексується, мовні сторінки мають власні hreflang. -->
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="assets/img/favicon.ico" sizes="32x32 48x48">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    // Переносить на мову, обрану тут раніше, або на мову браузера, якщо вона є серед мов сайту; інакше — англійська.
    (function () {
      var supported = ["en", "uk", "de", "es", "fr"];
      var saved = null;
      try { saved = localStorage.getItem("visdap-lang"); } catch (e) { /* приватний режим */ }
      if (saved && supported.indexOf(saved) !== -1) { location.replace(saved + "/"); return; }
      var prefs = navigator.languages || [navigator.language || "en"];
      for (var i = 0; i < prefs.length; i++) {
        var code = String(prefs[i]).toLowerCase().split("-")[0];
        if (supported.indexOf(code) !== -1) { location.replace(code + "/"); return; }
      }
      location.replace("en/");
    })();
  </script>
</head>
<body>
<main class="wrap narrow root-choose">
  <p class="brand"><img src="assets/img/icon-96.webp" width="48" height="48" alt=""> <span translate="no">Visdap</span></p>
  <h1>Visual Day Planner</h1>
  <ul class="root-langs"><li><a href="en/" hreflang="en" lang="en">English</a></li><li><a href="uk/" hreflang="uk" lang="uk">Українська</a></li><li><a href="de/" hreflang="de" lang="de">Deutsch</a></li><li><a href="es/" hreflang="es" lang="es">Español</a></li><li><a href="fr/" hreflang="fr" lang="fr">Français</a></li></ul>
</main>
</body>
</html>
